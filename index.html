<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Swipe">

<link rel="apple-touch-icon" href="icon.PNG">

<title>Money Swipe</title>

<style>
body{
margin:0;
font-family:-apple-system;
background:linear-gradient(180deg,#0a0f1c,#0d1628);
color:white;
text-align:center;
touch-action:manipulation;
user-select:none;
}

#money{
font-size:36px;
margin-top:20px;
font-weight:700;
}

#level{
opacity:.6;
margin-bottom:10px;
}

#bill{
width:260px;
margin-top:30px;
transition:0.1s;
filter:drop-shadow(0 10px 20px rgba(0,0,0,0.6));
}

#bill:active{
transform:scale(.9) rotate(-2deg);
}

button{
margin:10px;
padding:14px 26px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:600;
color:white;
background:linear-gradient(45deg,#ff7a00,#ff2d2d);
box-shadow:0 6px 15px rgba(255,80,0,0.4);
}

.shop{
margin-top:20px;
padding:10px;
}

.item{
background:rgba(255,255,255,0.05);
border-radius:16px;
padding:15px;
margin:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.dot{
width:18px;
height:18px;
border-radius:50%;
display:inline-block;
margin-right:10px;
}
</style>
</head>

<body>

<div id="money">💰 0</div>
<div id="level">Level 1</div>

<img id="bill" src="money.PNG">

<br>

<button onclick="upgrade()">Upgrade</button>
<button onclick="toggleShop()">Shop</button>

<div id="shop" class="shop" style="display:none;">
  
  <div class="item">
    <div><span class="dot" style="background:green"></span>Default</div>
    <button onclick="setSkin('money.PNG')">Use</button>
  </div>

  <div class="item">
    <div><span class="dot" style="background:blue"></span>Dollar 1 (200)</div>
    <button onclick="buySkin('dollar1.PNG',200)">Buy</button>
  </div>

  <div class="item">
    <div><span class="dot" style="background:purple"></span>Dollar 2 (500)</div>
    <button onclick="buySkin('dollar2.PNG',500)">Buy</button>
  </div>

  <div class="item">
    <div><span class="dot" style="background:gold"></span>Dollar 3 (1200)</div>
    <button onclick="buySkin('dollar3.PNG',1200)">Buy</button>
  </div>

</div>

<script>
let money = 0;
let perTap = 1;
let level = 1;
let upgradeCost = 50;

let owned = ["money.PNG"];
let currentSkin = "money.PNG";

const bill = document.getElementById("bill");

/* загрузка */
if(localStorage.save){
  const d = JSON.parse(localStorage.save);
  money = d.money || 0;
  perTap = d.perTap || 1;
  level = d.level || 1;
  upgradeCost = d.upgradeCost || 50;
  owned = d.owned || ["money.PNG"];
  currentSkin = d.currentSkin || "money.PNG";
  bill.src = currentSkin;
}

/* тап */
bill.onclick = () => {
  money += perTap;

  if(navigator.vibrate) navigator.vibrate(10);

  bill.style.transform="scale(0.9)";
  setTimeout(()=>bill.style.transform="scale(1)",80);

  update();
};

/* апгрейд */
function upgrade(){
  if(money >= upgradeCost){
    money -= upgradeCost;
    perTap += 1;
    level++;

    upgradeCost = Math.floor(upgradeCost * 1.8 + 25);

    update();
  }
}

/* магазин */
function toggleShop(){
  let shop = document.getElementById("shop");
  shop.style.display = shop.style.display === "none" ? "block" : "none";
}

function buySkin(name, price){
  if(owned.includes(name)){
    setSkin(name);
    return;
  }

  if(money >= price){
    money -= price;
    owned.push(name);
    setSkin(name);
    update();
  } else {
    alert("Не хватает денег");
  }
}

function setSkin(name){
  currentSkin = name;
  bill.src = name;
}

/* обновление */
function update(){
  document.getElementById("money").innerText = "💰 " + money;
  document.getElementById("level").innerText = "Level " + level + " | +" + perTap + " / tap";

  localStorage.save = JSON.stringify({
    money, perTap, level, upgradeCost, owned, currentSkin
  });
}

update();
</script>

</body>
</html>
