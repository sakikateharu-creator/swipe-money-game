<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.PNG">

<title>Money Swipe</title>

<style>
body{
margin:0;
font-family:-apple-system;
background:#0d1117;
color:white;
text-align:center;
touch-action:manipulation;
user-select:none;
overflow:hidden;
}

#money{
font-size:32px;
margin-top:20px;
}

#level{
opacity:.7;
}

#bill{
width:260px;
margin-top:40px;
transition:0.1s;
}

#bill:active{
transform:scale(.95);
}

button{
margin:10px;
padding:15px 25px;
border:none;
border-radius:20px;
font-size:18px;
color:white;
background:linear-gradient(45deg,orange,red);
}

#shop{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-radius:20px 20px 0 0;
padding:20px;
display:none;
}

.skin{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
background:#1c1c1c;
padding:10px;
border-radius:15px;
}
</style>
</head>

<body>

<div id="money">💰 0</div>
<div id="level">Level 1 | +1 / tap</div>

<img id="bill" src="money.JPG">

<br>

<button onclick="upgrade()">Upgrade</button>
<button onclick="toggleShop()">Shop</button>

<div id="shop">

<div class="skin">
<span>Default</span>
<button onclick="setSkin(0)">Use</button>
</div>

<div class="skin">
<span>Blue (200)</span>
<button onclick="buySkin(1)">Buy</button>
</div>

<div class="skin">
<span>Purple (400)</span>
<button onclick="buySkin(2)">Buy</button>
</div>

<div class="skin">
<span>Gold (800)</span>
<button onclick="buySkin(3)">Buy</button>
</div>

</div>

<script>
let money = 0;
let level = 1;
let perTap = 1;
let upgradeCost = 50;

let skins = [
"money.JPG",
"dollar1.JPG",
"dollar2.WEBP",
"dollar3.JPG"
];

let owned = [true,false,false,false];
let currentSkin = 0;

const bill = document.getElementById("bill");

bill.onclick = () => {
money += perTap;
update();
};

function update(){
document.getElementById("money").innerHTML = "💰 " + money;
document.getElementById("level").innerHTML = "Level " + level + " | +" + perTap + " / tap";
}

function upgrade(){
if(money >= upgradeCost){
money -= upgradeCost;
level++;
perTap++;
upgradeCost = Math.floor(upgradeCost * 1.8);
update();
}
}

function toggleShop(){
let s = document.getElementById("shop");
s.style.display = s.style.display === "block" ? "none" : "block";
}

function buySkin(id){
if(owned[id]){
setSkin(id);
return;
}

let price = [0,200,400,800];

if(money >= price[id]){
money -= price[id];
owned[id] = true;
setSkin(id);
update();
}
}

function setSkin(id){
currentSkin = id;
bill.src = skins[id];
}
</script>

</body>
</html>
