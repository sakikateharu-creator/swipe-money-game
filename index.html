<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Swipe">

<!-- иконка -->
<link rel="apple-touch-icon" href="icon.png">

<title>Money Swipe</title>

<style>
body{
margin:0;
font-family:-apple-system;
background:#0d1117;
color:white;
text-align:center;
touch-action:manipulation;
user-select:none;
}

#money{font-size:30px;margin-top:10px;}
#level{opacity:.7;}

#bill{width:200px;margin-top:40px;}
#bill:active{transform:scale(.9);}

button{
margin:10px;
padding:14px;
border:none;
border-radius:12px;
background:orange;
color:white;
}
</style>
</head>

<body>

<div id="money">💰 0</div>
<div id="level">Level 1</div>

<svg id="bill" viewBox="0 0 200 100">
<rect x="5" y="5" width="190" height="90" rx="15" fill="#4CAF50"/>
<circle cx="100" cy="50" r="20" fill="#2e7d32"/>
<text x="100" y="58" text-anchor="middle" fill="white" font-size="22">$</text>
</svg>

<script>
let money=0;

document.getElementById("bill").onclick=()=>{
money++;
document.getElementById("money").innerText="💰 "+money;

if(navigator.vibrate) navigator.vibrate(10);
};
</script>

</body>
</html>
