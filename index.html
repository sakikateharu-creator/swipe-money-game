<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Money Swipe ULTRA</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0f2027, #203a43, #000);
    color: white;
    text-align: center;
}

#money {
    font-size: 36px;
    margin-top: 20px;
}

#level {
    opacity: 0.7;
}

#gameArea {
    width: 300px;
    height: 220px;
    margin: 20px auto;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    display: flex;
    justify-content: center;
    align-items: center;
}

#bill {
    width: 180px;
    cursor: pointer;
    transition: 0.1s;
}

#bill:active {
    transform: scale(0.9);
}

button {
    margin: 10px;
    padding: 15px 25px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(45deg, orange, red);
    color: white;
    font-size: 16px;
}

.effect {
    position: absolute;
    color: lime;
    font-size: 20px;
    animation: float 0.6s forwards;
}

@keyframes float {
    0% { transform: translate(-50%, -50%); opacity: 1; }
    100% { transform: translate(-50%, -120%); opacity: 0; }
}
</style>
</head>

<body>

<div id="money">💰 0</div>
<div id="level">Level 1</div>

<div id="gameArea">
<svg id="bill" viewBox="0 0 200 100">
    <rect x="5" y="5" width="190" height="90" rx="15" fill="#4CAF50"/>
    <circle cx="100" cy="50" r="20" fill="#2e7d32"/>
    <text x="100" y="58" text-anchor="middle" fill="white" font-size="22">$</text>
</svg>
</div>

<button onclick="upgrade()">Upgrade</button>
<button onclick="buyAuto()">Auto Income</button>

<script>
let money = 0;
let income = 1;
let level = 1;
let auto = 0;

const moneyEl = document.getElementById("money");
const levelEl = document.getElementById("level");
const bill = document.getElementById("bill");

bill.addEventListener("touchstart", clickMoney);
bill.addEventListener("mousedown", clickMoney);

function clickMoney(e) {
    money += income;
    spawnEffect(e);
    update();
}

function update() {
    moneyEl.innerText = "💰 " + money;
    levelEl.innerText = "Level " + level;
    save();
}

function upgrade() {
    let cost = level * 50;

    if (money >= cost) {
        money -= cost;
        income++;
        level++;

        let colors = ["#4CAF50","#2196F3","#9C27B0","#FF9800","#F44336"];
        bill.querySelector("rect").setAttribute("fill", colors[level % colors.length]);

        update();
    } else {
        alert("Мало денег");
    }
}

function buyAuto() {
    let cost = (auto + 1) * 100;

    if (money >= cost) {
        money -= cost;
        auto++;
        update();
    } else {
        alert("Недостаточно");
    }
}

setInterval(() => {
    if (auto > 0) {
        money += auto;
        update();
    }
}, 1000);

function spawnEffect(e) {
    let el = document.createElement("div");
    el.className = "effect";
    el.innerText = "+" + income;

    let x = e.touches ? e.touches[0].clientX : e.clientX;
    let y = e.touches ? e.touches[0].clientY : e.clientY;

    el.style.left = x + "px";
    el.style.top = y + "px";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
}

function save() {
    localStorage.setItem("moneyGame", JSON.stringify({
        money, income, level, auto
    }));
}

function load() {
    let data = JSON.parse(localStorage.getItem("moneyGame"));
    if (data) {
        money = data.money;
        income = data.income;
        level = data.level;
        auto = data.auto;
        update();
    }
}

load();
</script>

</body>
</html>
