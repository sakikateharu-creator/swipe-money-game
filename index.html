<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Swipe">

<link rel="apple-touch-icon" href="icon.PNG">

<title>Money Swipe</title>

<style>
body{
margin:0;
font-family:-apple-system;
background:#0d1117;
color:white;
text-align:center;
touch-action:manipulation;
user-select:none;
}

#money{font-size:32px;margin-top:10px;}
#level{opacity:.7;}

#bill{
width:230px;
margin-top:40px;
transition:.1s;
}

#bill:active{transform:scale(.9);}

button{
margin:8px;
padding:12px 20px;
border:none;
border-radius:14px;
background:linear-gradient(45deg,orange,red);
color:white;
}

#shop{
display:none;
}

.skin{
margin:6px;
padding:10px;
background:#161b22;
border-radius:10px;
}
</style>
</head>

<body>

<div id="money">💰 0</div>
<div id="level">Level 1</div>

<img id="bill" src="icon.PNG">

<br>

<button onclick="upgrade()">Upgrade</button>
<button onclick="toggleShop()">Shop</button>

<div id="shop">

<div class="skin">
🟢 Default (free)
<button onclick="setSkin('icon.PNG')">Use</button>
</div>

<div class="skin">
🔵 Blue (200)
<button onclick="buySkin('https://i.imgur.com/8Qf6Y7h.png',200)">Buy</button>
</div>

<div class="skin">
🟣 Purple (400)
<button onclick="buySkin('https://i.imgur.com/L6X4dVQ.png',400)">Buy</button>
</div>

<div class="skin">
🟡 Gold (800)
<button onclick="buySkin('https://i.imgur.com/6XKQZQp.png',800)">Buy</button>
</div>

</div>

<script>
let money=0,level=1,power=1;
let skin="icon.PNG";

const moneyEl=document.getElementById("money");
const levelEl=document.getElementById("level");
const bill=document.getElementById("bill");

/* load */
if(localStorage.save){
let d=JSON.parse(localStorage.save);
money=d.money||0;
level=d.level||1;
power=d.power||1;
skin=d.skin||"icon.PNG";
bill.src=skin;
}

/* tap */
bill.onclick=()=>{
money+=power;
if(navigator.vibrate) navigator.vibrate(10);
update();
};

/* upgrade */
function upgrade(){
if(money>=50){
money-=50;
power++;
level++;
update();
}
}

/* shop */
function toggleShop(){
let s=document.getElementById("shop");
s.style.display=s.style.display=="none"?"block":"none";
}

function buySkin(url,cost){
if(money>=cost){
money-=cost;
skin=url;
bill.src=url;
update();
}
}

function setSkin(url){
skin=url;
bill.src=url;
update();
}

/* update */
function update(){
moneyEl.innerText="💰 "+money;
levelEl.innerText="Level "+level;
localStorage.save=JSON.stringify({money,level,power,skin});
}

update();
</script>

</body>
</html>
