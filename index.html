<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Swipe</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0d1117;
    color:white;
    text-align:center;
}

.screen { display:none; }
.active { display:block; }

.btn {
    padding:12px;
    margin:10px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff9800,#ff5722);
}

.money {
    width:220px;
    margin:40px auto;
    transition:0.15s;
}
.money:active {
    transform:scale(0.95);
}

.card {
    background:#161b22;
    margin:10px;
    padding:10px;
    border-radius:12px;
}

.float {
    position:absolute;
    color:#00ffcc;
    animation:floatUp 1s forwards;
}

@keyframes floatUp {
    0% {opacity:1; transform:translateY(0);}
    100% {opacity:0; transform:translateY(-80px);}
}
</style>
</head>

<body>

<div id="menu" class="screen active">
    <h1>Money Swipe</h1>
    <div class="btn" onclick="start()">Play</div>
    <div class="btn" onclick="shop()">Shop</div>
</div>

<div id="game" class="screen">
    <h2 id="score">💰 0</h2>
    <div id="level">Level 1</div>

    <!-- ВОТ ЗДЕСЬ Я УЖЕ ПОСТАВИЛ НОРМ КАРТИНКУ -->
    <img src="https://i.imgur.com/8QfZQ0G.png" id="money" class="money">

    <div class="btn" onclick="menu()">Menu</div>
</div>

<div id="shop" class="screen">
    <h2>Shop</h2>

    <div class="card">
        <div class="btn" onclick="buyIncome()">+1 Income (50)</div>
        <div class="btn" onclick="buyIdle()">Idle +1/s (100)</div>
        <div class="btn" onclick="buyMulti()">x2 (200)</div>
    </div>

    <div class="btn" onclick="menu()">Back</div>
</div>

<audio id="sound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-coin-216.wav"></audio>

<script>
let score=+localStorage.score||0;
let income=+localStorage.income||1;
let idle=+localStorage.idle||0;
let multi=+localStorage.multi||1;
let level=+localStorage.level||1;

let last=localStorage.last||Date.now();
score+=idle*((Date.now()-last)/1000);

update();

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function start(){ show("game"); }
function shop(){ show("shop"); }
function menu(){ show("menu"); }

let startY=0;
let money=document.getElementById("money");

money.addEventListener("touchstart",e=>{
startY=e.touches[0].clientY;
});

money.addEventListener("touchend",e=>{
if(startY - e.changedTouches[0].clientY > 50){
earn(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
}
});

function earn(x,y){
let gain=income*multi;
score+=gain;

document.getElementById("sound").play();
if(navigator.vibrate) navigator.vibrate(10);

let el=document.createElement("div");
el.className="float";
el.innerText="+"+gain;
el.style.left=x+"px";
el.style.top=y+"px";
document.body.appendChild(el);
setTimeout(()=>el.remove(),1000);

update();
save();
}

function buyIncome(){ if(score>=50){score-=50; income++;}}
function buyIdle(){ if(score>=100){score-=100; idle++;}}
function buyMulti(){ if(score>=200){score-=200; multi*=2;}}

setInterval(()=>{
score+=idle;
update();
save();
},1000);

function update(){
level=Math.floor(score/500)+1;
document.getElementById("score").innerText="💰 "+Math.floor(score);
document.getElementById("level").innerText="Level "+level;
}

function save(){
localStorage.score=score;
localStorage.income=income;
localStorage.idle=idle;
localStorage.multi=multi;
localStorage.level=level;
localStorage.last=Date.now();
}
</script>

</body>
</html>
